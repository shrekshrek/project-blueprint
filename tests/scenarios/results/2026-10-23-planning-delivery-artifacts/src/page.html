<!doctype html><html lang="zh"><meta charset="utf-8"><title>SYN 目录与查看范围</title><style>body{font:16px system-ui;background:#f1f4f8;color:#183047;max-width:1100px;margin:32px auto}section{background:white;padding:24px;margin:20px 0;border-radius:12px}button,select,input{padding:10px;margin:5px}textarea{width:98%;height:180px}pre{white-space:pre-wrap;overflow-wrap:anywhere}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}table{width:100%}#status{color:#19563d}</style><h1>目录关系与查看范围 · 首片</h1><p>仅本机 SYN 试验 · 无真实认证 · 内存状态重启复位 · 部门授权尚未实现</p><label>合成主体<select id="actor"><option value="SYN-P1">SYN Alex</option><option value="SYN-P2">SYN Bo</option><option value="SYN-P3">SYN Cai</option><option value="SYN-ADMIN">SYN 超管</option></select></label><button id="refresh">刷新最新范围</button><p id="status" role="status"></p><section><h2>当前可见员工</h2><p id="revision"></p><table><thead><tr><th>员工</th><th>部门</th><th>原因</th></tr></thead><tbody id="rows"></tbody></table></section><section id="admin" hidden><h2>目录维护（仅超管）</h2><label>员工<select id="employee"></select></label><label>上级<select id="manager"></select></label><button id="adjust">保存人工关系</button><button id="follow">恢复跟随导入</button><h3>重导入合成名单</h3><textarea id="data" aria-label="合成名单JSON"></textarea><p><label>确认停用缺失员工（ID逗号分隔）<input id="missing" placeholder="SYN-P3"></label></p><button id="preview">预览导入差异</button><button id="publish" disabled>发布已预览名单</button><pre id="diff"></pre><h3>维护审计</h3><pre id="audit"></pre></section><script>
const $=id=>document.getElementById(id);let revision,previewed=null;
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'x-syn-actor':$('actor').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const value=await r.json();if(!r.ok)throw Error(value.error);return value}
function showError(e){$('status').textContent=e.message;}
async function refresh(){previewed=null;$('publish').disabled=true;try{const result=await api('scope');revision=result.revision;$('revision').textContent=`快照 ${revision} · ${result.people.length} 人`;$('rows').replaceChildren();for(const p of result.people){const tr=document.createElement('tr');for(const text of [p.name+' · '+p.id,p.departmentId,p.reasons.join(' + ')]){const td=document.createElement('td');td.textContent=text;tr.append(td)}$('rows').append(tr)}$('admin').hidden=$('actor').value!=='SYN-ADMIN';if(!$('admin').hidden){const d=await api('directory');for(const id of ['employee','manager']){const old=$(id).value;$(id).replaceChildren();if(id==='manager')$(id).add(new Option('无上级（显式撤销）',''));for(const p of d.employees.filter(p=>p.active))$(id).add(new Option(p.name,p.id));if([...$(id).options].some(o=>o.value===old))$(id).value=old}if(!$('data').value)$('data').value=JSON.stringify(d.fixture,null,2);$('audit').textContent=JSON.stringify(d.audit,null,2)}}catch(e){$('rows').replaceChildren();$('revision').textContent='查询拒绝';showError(e)}}
async function mutate(action){try{await action();$('status').textContent='已发布；下一次读取为最新完整快照';await refresh()}catch(e){showError(e)}}
$('actor').onchange=()=>{$('status').textContent='';refresh()};$('refresh').onclick=refresh;
$('adjust').onclick=()=>mutate(()=>api('relation',{employeeId:$('employee').value,managerId:$('manager').value||null,expectedRevision:revision}));$('follow').onclick=()=>mutate(()=>api('relation',{employeeId:$('employee').value,followImport:true,expectedRevision:revision}));
for(const id of ['data','missing'])$(id).oninput=()=>{previewed=null;$('publish').disabled=true};
$('preview').onclick=async()=>{try{const request={data:JSON.parse($('data').value),confirmedMissing:$('missing').value.split(',').map(s=>s.trim()).filter(Boolean)};const result=await api('import/preview',request);previewed={...request,expectedRevision:result.revision,batchId:'SYN-BATCH-'+Date.now()};$('diff').textContent=JSON.stringify({before:result.before,after:result.after},null,2);$('publish').disabled=false;$('status').textContent='预览完成；请检查前后关系和停用名单再发布'}catch(e){previewed=null;$('publish').disabled=true;showError(e)}};
$('publish').onclick=()=>mutate(()=>api('import',previewed));refresh();
</script></html>
